services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: deezybot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    networks:
      - deezybot-network
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      # Współdzielony z dashboardem (./assets:/assets) — bot czyta wgrane
      # obrazki/GIF-y Powitań z process.cwd()/assets/... w czasie działania,
      # więc musi widzieć ten sam katalog na hoście, nie tylko kopię z buildu.
      - ./assets:/app/assets

  dashboard:
    build:
      context: ./dashboard-nextjs
      dockerfile: ../Dockerfile.dashboard
      args:
        NEXT_PUBLIC_DISCORD_CLIENT_ID: "1119327417237000285"
    container_name: deezybot-dashboard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - dashboard-nextjs/.env.local
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - deezybot-network
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Bez :ro — dashboard zapisuje tu uploady (greetings/uploads, lobby/uploads)
      # przy każdym zapisie configu Powitań, nie tylko przy dodaniu pliku.
      - ./assets:/assets
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy

  # Redis — session cache, rate limiting (upgrade from in-memory when scaling)
  redis:
    image: redis:7-alpine
    container_name: deezybot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - deezybot-network
    volumes:
      - redis-data:/data
    # Not exposed externally — only accessible within deezybot-network

  # MongoDB — jednowęzłowy replica set (rs0), żeby działały transakcje (ekonomia: saldo +
  # wpis w ledgerze atomowo). Dane i keyFile leżą na zaszyfrowanym wolumenie LUKS
  # (DEEZY_SECURE_DIR, domyślnie /srv/deezy-secure) — Discord Developer Terms §5c wymagają
  # szyfrowania danych w spoczynku, a Mongo Community samo tego nie robi.
  # Konfiguracja wolumenu i pierwsze uruchomienie: skrypty w ops/mongo/.
  mongo:
    image: mongo:8.0
    container_name: deezybot-mongo
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --replSet
      - rs0
      - --keyFile
      - /etc/mongo/keyfile
      - --bind_ip_all
      # Limit cache WiredTiger — domyślnie bierze ~50% RAM, a dzielimy VPS z botem i dashboardem.
      - --wiredTigerCacheSizeGB
      - "0.75"
    env_file:
      - mongo.env
    networks:
      - deezybot-network
    # Tylko localhost VPS (np. do Compass przez tunel SSH) — nigdy publicznie.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ${DEEZY_SECURE_DIR:-/srv/deezy-secure}/mongo/data:/data/db
      - ${DEEZY_SECURE_DIR:-/srv/deezy-secure}/mongo/keyfile:/etc/mongo/keyfile:ro
    healthcheck:
      # ping nie wymaga logowania
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  deezybot-network:

volumes:
  redis-data: